name: Auto Build Janu V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix and Safe UI Implementation
        run: |
          cd JanuV3
          
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "<queries>" "$MANIFEST_PATH"; then
              sed -i '/<\/manifest>/i \
              <queries>\n    <intent>\n        <action android:name="android.intent.action.MAIN"/>\n        <category android:name="android.intent.category.LAUNCHER"/>\n    </intent>\n<\/queries>' "$MANIFEST_PATH"
            fi
          fi

          mkdir -p app/src/main/java/com/janu/v3
          cat << 'EOF' > app/src/main/java/com/janu/v3/MainActivity.java
          package com.janu.v3;

          import android.os.Bundle;
          import android.content.Intent;
          import android.content.pm.ResolveInfo;
          import android.widget.ArrayAdapter;
          import android.widget.ListView;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      ListView listView = new ListView(this);
                      setContentView(listView);

                      Intent main = new Intent(Intent.ACTION_MAIN, null);
                      main.addCategory(Intent.CATEGORY_LAUNCHER);
                      
                      List<ResolveInfo> apps = getPackageManager().queryIntentActivities(main, 0);
                      List<String> appNames = new ArrayList<>();
                      
                      if (apps != null && !apps.isEmpty()) {
                          Collections.sort(apps, new Comparator<ResolveInfo>() {
                              @Override
                              public int compare(ResolveInfo a, ResolveInfo b) {
                                  return a.loadLabel(getPackageManager()).toString()
                                          .compareToIgnoreCase(b.loadLabel(getPackageManager()).toString());
                              }
                          });

                          for (ResolveInfo info : apps) {
                              appNames.add(info.loadLabel(getPackageManager()).toString());
                          }
                      } else {
                          appNames.add("কোনো অ্যাপ পাওয়া যায়নি!");
                      }

                      ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, appNames);
                      listView.setAdapter(adapter);

                  } catch (Exception e) {
                      TextView errorView = new TextView(this);
                      errorView.setText("Error: " + e.getMessage());
                      errorView.setTextSize(18);
                      setContentView(errorView);
                  }
              }
          }
          EOF

          if [ -f app/build.gradle ]; then
            if ! grep -q "appcompat" app/build.gradle; then
              echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> app/build.gradle
            fi
          fi

      - name: Build APK
        run: |
          cd JanuV3
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Janu-V3-debug
          path: JanuV3/app/build/outputs/apk/debug/app-debug.apk
