name: Janu V3 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Project
        run: unzip Janu_V3_Project.zip

      - name: Setup Gradle and Build APK
        run: |
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
          cd $PROJECT_DIR
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/app-debug.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JanuV3-APK
          path: app-debug.apk
